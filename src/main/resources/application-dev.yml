spring:
  datasource:
    url: jdbc:mysql://localhost:3306/enterprise_crm
    username: root
    password: asif
  jpa:
    hibernate:
      ddl-auto: update        # ddl-auto: update → Dev me table auto create/update ho jayegi.
    show-sql: true            # show-sql true → Query console me dikhegi (debugging ke liye).
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO

management:
  endpoints:
    web:
      exposure:
        include: "*"  #health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

